version: '3.8'

services:
  # 1. PostgreSQL Datenbank
  postgres:
    image: postgres:16-alpine
    container_name: antiques-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: antiques_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d antiques_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Vision Service (FastAPI)
  vision-service:
    build:
      context: ./vision-service
      dockerfile: Dockerfile
    container_name: antiques-vision-service
    ports:
      - "4001:4001"
    environment:
      - PORT=4001

  # 3. Pricing Service (Node.js Express)
  pricing-service:
    build:
      context: ./pricing-service
      dockerfile: Dockerfile
    container_name: antiques-pricing-service
    ports:
      - "4002:4002"
    environment:
      - PORT=4002
      - PRICE_API_KEY=DEMO_API_KEY_123
      - PRICE_API_URL=https://api.example-price-comparison.com/v1/search

  # 4. Backend Gateway (Node.js Express API)
  backend-gateway:
    build:
      context: ./backend-gateway
      dockerfile: Dockerfile
    container_name: antiques-backend-gateway
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - DB_URL=postgresql://postgres:postgrespassword@postgres:5432/antiques_db
      - VISION_SERVICE_URL=http://vision-service:4001
      - PRICING_SERVICE_URL=http://pricing-service:4002
    depends_on:
      postgres:
        condition: service_healthy
      vision-service:
        condition: service_started
      pricing-service:
        condition: service_started

volumes:
  postgres_data:
